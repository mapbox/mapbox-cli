  securitySchemes:
    AccessTokenAuth:
      type: apiKey
      in: query
      name: access_token
      description: A valid Mapbox access token
  parameters:
    access_token:
      name: access_token
      in: query
      required: true
      description: A valid Mapbox [access token](https://docs.mapbox.com/api/overview/#access-tokens-and-token-scopes).
      schema:
        type: string
    permanent:
      name: permanent
      in: query
      required: false
      description: Specify whether you intend to store the results of the query (`true`) or not (`false`,
        default). Permanent geocoding allows caching and storing results indefinitely. Requires a valid
        credit card on file or an active enterprise contract.
      schema:
        type: boolean
        default: false
    bbox:
      name: bbox
      in: query
      required: false
      description: |
        Limit results to only those contained within the supplied bounding box. Bounding boxes should be supplied as four numbers separated by commas, in `minLon,minLat,maxLon,maxLat` order. The bounding box cannot cross the 180th meridian. You can use the [Location Helper](https://labs.mapbox.com/location-helper/) to find a bounding box.
      schema:
        type: string
        example: -77.083056,38.908611,-76.997778,38.959167
    language:
      name: language
      in: query
      required: false
      description: |
        Set the language of the text supplied in responses. Also affects result scoring, with results matching the user's query in the requested language being preferred over results that match in another language. For example, an autocomplete query for things that start with `Frank` might return `Frankfurt` as the first result with an English (`en`) language parameter, but `Frankreich` ("France") with a German (`de`) language parameter.

        Options are [IETF language tags](https://en.wikipedia.org/wiki/IETF_language_tag) comprised of a mandatory [ISO 639-1 language code](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) and, optionally, one or more IETF subtags for country or script. More than one value can also be specified, separated by commas. The first language in the list will be the primary language. For other languages, translations will be provided in the `context` object's `translations` property. Maximum 20 languages; values must be unique.

        When providing more than one language, the `country`, `region`, `district`, `place`, and `neighborhood` context sub-objects will include a `translations` property. This is an object where the key is the language code and the value is an object with `language` and `name` properties.

        Example of the context object when passing the parameter `language=en,es`:

        ```json
        {
          "context": {
            "place": {
              "mapbox_id": "dXJuOm1ieHBsYzpGSmlvN0E",
              "name": "Washington",
              "wikidata_id": "Q61",
              "translations": {
                "en": { "language": "en", "name": "Washington" },
                "es": { "language": "es", "name": "Washington" }
              }
            },
            "country": {
              "mapbox_id": "dXJuOm1ieHBsYzpJdXc",
              "name": "United States",
              "wikidata_id": "Q30",
              "country_code": "US",
              "country_code_alpha_3": "USA",
              "translations": {
                "en": { "language": "en", "name": "United States" },
                "es": { "language": "es", "name": "Estados Unidos" }
              }
            }
          }
        }
        ```
      schema:
        type: string
        example: en
    proximity:
      name: proximity
      in: query
      required: false
      description: Bias the response to favor results that are closer to this location. Provided as two
        comma-separated coordinates in `longitude,latitude` order, or the string `ip` to bias based on
        reverse IP lookup.
      schema:
        type: string
        example: -74.70850,40.78375
    types_v6:
      name: types
      in: query
      required: false
      description: |
        Filter results to include only a subset (one or more) of the available feature types. Options are `country`, `region`, `postcode`, `district`, `place`, `locality`, `neighborhood`, `street`, and `address`. Multiple options can be comma-separated.

        Various types of geographic features are available the Mapbox geocoding. Any type might appear as a top-level response, as context in a top-level response, or as a filtering option using the `types` parameter. Not all features are available or relevant in all parts of the world. New types are occasionally added as necessary to correctly capture global administrative hierarchies.

          The geographic feature types listed from the largest to the most granular, are:

          | Feature Type        | Description                                                                                                                                                                                                                                                                       |
          | ------------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
          | `country`           | Generally recognized countries or, in some cases like Hong Kong, an area of quasi-national administrative status that has a designated country code under [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html).                                                          |
          | `region`            | Top-level sub-national administrative features, such as states in the United States or provinces in Canada or China.                                                                                                                                                              |
          | `postcode`          | Postal codes used in country-specific national addressing systems.                                                                                                                                                                                                                |
          | `district`          | Features that are smaller than top-level administrative features but typically larger than cities, in countries that use such an additional layer in postal addressing (for example, prefectures in China).                                                                       |
          | `place`             | Typically these are cities, villages, municipalities, etc. They're usually features used in postal addressing, and are suitable for display in ambient end-user applications where current-location context is needed (for example, in weather displays).                         |
          | `locality`          | Official sub-city features present in countries where such an additional administrative layer is used in postal addressing, or where such features are commonly referred to in local parlance. Examples include city districts in Brazil and Chile and arrondissements in France. |
          | `neighborhood`      | Colloquial sub-city features often referred to in local parlance. Unlike `locality` features, these typically lack official status and may lack universally agreed-upon boundaries.                                                                                               |
          | `street`            | Street features which host one or more addresses.                                                                                                                                                                                                                                 |
          | `block`             | Special feature type reserved for Japanese addresses.                                                                                                                                                                                                                             |
          | `address`           | Individual residential or business addresses.                                                                                                                                                                                                                                     |
          | `secondary_address` | Sub-unit, suite, or lot within a single parent address. Currently available in the US only.                                                                                                                                                                                       |
      schema:
        type: string
        enum:
        - country
        - region
        - postcode
        - district
        - place
        - locality
        - neighborhood
        - street
        - block
        - address
        - secondary_address
        example: country,region
    worldview:
      name: worldview
      in: query
      required: false
      description: |
        Returns features that are defined differently by audiences that belong to various regional, cultural, or political groups. If `worldview` is not set, the `us` worldview boundaries are returned by default.

        Each query supports a maximum of one worldview. Attempting to query for multiple worldviews in one search will result in an error message.

        Use the optional `worldview` parameter to identify geographic features whose characteristics are defined differently by audiences belonging to various regional, cultural, or political groups. The Geocoding API only supports worldviews for the `country` and `region` data types, but may expand to additional data types in the future.

        The Geocoding API supports the following values for the `worldview` parameter:

        | Value | Description                              |
        | ----- | ---------------------------------------- |
        | `ar`  | Features for an Argentinian audience     |
        | `cn`  | Features for a mainland Chinese audience |
        | `in`  | Features for an Indian audience          |
        | `jp`  | Features for a Japanese audience         |
        | `ma`  | Features for a Moroccan audience         |
        | `rs`  | Features for a Serbian audience          |
        | `ru`  | Features for a Russian audience          |
        | `tr`  | Features for a Turkish audience          |
        | `us`  | Features for an American audience        |

        _Returned features are not officially approved for use by the above countries' respective governments._

        Each query supports a maximum of one worldview. Attempting to query for multiple worldviews in one search will result in an error message. When no worldview is selected, the Geocoding API returns features for the `us` worldview.

        ### Using the `worldview` parameter

        In Mapbox services, the [worldview](https://docs.mapbox.com/help/glossary/worldview/) data field is used to identify geographic features whose characteristics are defined differently by audiences belonging to various regional, cultural, or political groups. Setting a worldview affects the place values returned for an address that is located in an area of non-unanimous ownership or definition.

        For example, consider an address in the Ilemi Triangle, which borders Eastern Equatoria (South Sudan) and Turkana (Kenya). Depending on the worldview selected, an address in this location will be returned in different country contexts:
          - If `worldview=cn`, Kaaleng, Eastern Equatoria, or South Sudan will be returned.
          - If `worldview=us`, Kaaleng, Turkana, or Kenya will be returned.

        This means that if you use `worldview=cn` with the Kenya (`ke`) country filter, a search for an address in this area will not be successful. Instead, you would need to use `worldview=cn` in combination with the South Sudan (`ss`) country filter.

        Be cautious when combining `worldview` with the `country` parameter, since these indices are only loosely coupled.

        For a visual example of how changing the `worldview` value impacts the boundaries on a map, see the [companion Maps boundary service](https://docs.mapbox.com/mapbox-gl-js/example/toggle-worldviews/).
      schema:
        type: string
        enum:
        - ar
        - cn
        - in
        - jp
        - ma
        - rs
        - ru
        - tr
        - us
    entrances:
      name: entrances
      in: query
      required: false
      description: Specify whether to return building entrance data (`true`) or not (`false`, default).
        When set to `true`, building entrances associated with address features will be included in the
        response. This includes both permanent and temporary geocoding. **This parameter is in Public
        Preview.**
      schema:
        type: boolean
        default: false
  schemas:
    GeocodingResponse:
      type: object
      description: |
        A GeoJSON FeatureCollection containing geocoding results.
        The response to a Geocoding API request is an object that contains the following properties:

        | Property      | Type     | Description                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     |
        | ------------- | -------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
        | `type`        | `string` | `"FeatureCollection"`, a GeoJSON type from the [GeoJSON specification](https://tools.ietf.org/html/rfc7946).                                                                                                                                                                                                                                                                                                                                                                                                    |
        | `features`    | `array`  | An array of feature objects. **Forward geocodes:** Returned features are ordered by relevance. **Reverse geocodes:** Returned features are ordered by index hierarchy, from most specific features to least specific features that overlap the queried coordinates.                                                                                                                                                                                                                                              |
        | `attribution` | `string` | Attributes the results of the Mapbox Geocoding API to Mapbox.                                                                                                                                                                                                                                                                                                                                                                                                                                                   |

        The data powering the Mapbox Geocoding API is constantly being updated and improved. This means that the values of properties in the response object are not guaranteed and may change within the same version of the API. Properties may be added to, but will not be removed from, the response within the same API version.

        Each feature object in the `features` array may have the properties described below:

        | Property                      | Type     | Description                                                                                                                                                                                                                                                                                                                                                                                                   |
        | ----------------------------- | -------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
        | `id`                          | `string` | Feature id. This property is named "id" to conform to the GeoJSON specification, but is the same id referred to as `mapbox_id` elsewhere in the response.                                                                                                                                                                                                                                                    |
        | `type`                        | `string` | `"Feature"`, a GeoJSON type from the [GeoJSON specification](https://tools.ietf.org/html/rfc7946).                                                                                                                                                                                                                                                                                                            |
        | `geometry`                    | `object` | An object describing the spatial geometry of the returned feature.                                                                                                                                                                                                                                                                                                                                            |
        | `geometry.type`               | `string` | `"Point"`, a GeoJSON type from the [GeoJSON specification](https://tools.ietf.org/html/rfc7946).                                                                                                                                                                                                                                                                                                              |
        | `geometry.coordinates`        | `array`  | An array in the format `[longitude,latitude]` at the center of the specified `bbox`.                                                                                                                                                                                                                                                                                                                          |
        | `properties`                  | `object` | An object containing the resulting feature's details.                                                                                                                                                                                                                                                                                                                                                         |
        | `properties.mapbox_id`        | `string` | Feature id. The `mapbox_id` uniquely identifies a place in the Mapbox search database. Mapbox IDs are accepted in requests to the Geocoding API as a forward search, and will return the feature corresponding to that id.                                                                                                                                                                                    |
        | `properties.feature_type`     | `string` | A string describing the type of the feature. Options are `country`, `region`, `postcode`, `district`, `place`, `locality`, `neighborhood`, `street`, `address`. _Formerly `place_type` in v5._                                                                                                                                                                                                               |
        | `properties.name`             | `string` | Formatted string of address_number and street.                                                                                                                                                                                                                                                                                                                                                                |
        | `properties.name_preferred`   | `string` | The canonical or otherwise more common alias for the feature name. For example, searching for "America" will return "America" as the name, and "United States" as `name_preferred`.                                                                                                                                                                                                                           |
        | `properties.place_formatted`  | `string` | Formatted string of result context: place region country postcode. The part of the result which comes after `name`.                                                                                                                                                                                                                                                                                           |
        | `properties.full_address`     | `string` | Full formatted string of the feature, combining name_preferred and place_formatted.                                                                                                                                                                                                                                                                                                                           |
        | `properties.context`          | `object` | A context object representing the hierarchy of encompassing parent features. This may include a sub-object for any of: `country`, `region`, `postcode`, `district`, `place`, `locality`, `neighborhood`, `street`. Which sub-objects are included is dependent upon the data coverage available and applicable to a given country or area.                                                                     |
        | `properties.coordinates`      | `object` | An object representing the geographical position and accuracy of the feature and any routable points.                                                                                                                                                                                                                                                                                                         |
        | `properties.coordinates.longitude` | `number` | Longitude of result.                                                                                                                                                                                                                                                                                                                                                                              |
        | `properties.coordinates.latitude`  | `number` | Latitude of result.                                                                                                                                                                                                                                                                                                                                                                               |
        | `properties.coordinates.accuracy`  | `string` | Accuracy metric for a returned `address`-type result. See Point accuracy for address features below.                                                                                                                                                                                                                                                                                              |
        | `properties.coordinates.routable_points` | `array` | An array of routable point objects for an address feature, each including `name`, `longitude`, and `latitude` properties.                                                                                                                                                                                                                                                                   |
        | `properties.bbox`             | `array`  | The bounding box of the feature as an array of `[minLon,minLat,maxLon,maxLat]`. This property is only provided with features of type `country`, `region`, `postcode`, `district`, `place`, `locality`, or `neighborhood`.                                                                                                                                                                                     |
        | `properties.match_code`       | `object` | Additional metadata indicating how the result components match to the input query. See Smart Address Match below.                                                                                                                                                                                                                                                                                             |

        ### The Context Object

        The `context` object within `properties` is a powerful piece of data which breaks out the complete geographical hierarchy for a given address or place. It is both a reliable way to access the named values of each component part of an address, plus contains feature-specific data such as the Wikidata id and 3-letter alpha country code.

        Each sub-object in the context always has a `mapbox_id` and `name` associated with it. The id can be queried directly via a forward geocoding search to traverse into a different geographical layer. Address features will also include an `address` sub-object, which additionally contains `street_name` and `address_number` properties.

        A `secondary_address` feature will also have a matching sub-object in the context:

        ```json
        {
          "secondary_address": {
            "mapbox_id": "dXJuOm1ieGFkci11bml0OjdkZTE3MmUxLTJiMjktNDU1Mi1iNGQzLTkwN2JjMGZmOGQ1NDoyMDE",
            "name": "UNIT 201",
            "designator": "UNIT",
            "identifier": "201",
            "extrapolated": true
          }
        }
        ```

        The following is an example of the context object returned for the address `2595 Lucky John Drive, Park City, Utah 84060, United States`:

        ```json
        "context": {
            "address": {
                "mapbox_id": "dXJuOm1ieGFkcjozOGY3OTg1OC1jNzY0LTQ4ZGUtYTFmMC04NjJjOTM1ZWViMjc",
                "address_number": "2595",
                "street_name": "Lucky John Drive",
                "name": "2595 Lucky John Drive"
            },
            "street": {
                "mapbox_id": "dXJuOm1ieGFkcjozOGY3OTg1OC1jNzY0LTQ4ZGUtYTFmMC04NjJjOTM1ZWViMjc",
                "name": "Lucky John Drive"
            },
            "neighborhood": {
                "mapbox_id": "dXJuOm1ieHBsYzpITktzN0E",
                "name": "Park Meadows"
            },
            "postcode": {
                "mapbox_id": "dXJuOm1ieHBsYzpFUjNPN0E",
                "name": "84060"
            },
            "place": {
                "mapbox_id": "dXJuOm1ieHBsYzpEdjlvN0E",
                "name": "Park City",
                "wikidata_id": "Q482993"
            },
            "district": {
                "mapbox_id": "dXJuOm1ieHBsYzpBVlRHN0E",
                "name": "Summit County",
                "wikidata_id": "Q484563"
            },
            "region": {
                "mapbox_id": "dXJuOm1ieHBsYzpCa1Rz",
                "name": "Utah",
                "wikidata_id": "Q829",
                "region_code": "UT",
                "region_code_full": "US-UT"
            },
            "country": {
                "mapbox_id": "dXJuOm1ieHBsYzpJdXc",
                "name": "United States",
                "wikidata_id": "Q30",
                "country_code": "US",
                "country_code_alpha_3": "USA"
            }
        }
        ```
        ### Smart Address Match

        The `match_code` object in the Geocoding API helps you understand how the resulting address feature aligns with the query submitted. Available only for address-type features, the `match_code` provides a breakdown of how each element of the result matches with the query, plus a confidence score, based on how well it matches. This can help you make decisions about what results to keep or throw out based on your application's tolerance for fuzzy matching on the query.

        Smart Address Match is available for all forward geocoding requests that return an `address` type feature. It works best when using Structured Input forward queries, as the request components must be typed explicitly.

        | Confidence Score | Description                                                                                                                                                                                            |
        | ---------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
        | `exact`          | No components are unmatched (up to 2 may be inferred) and there are no extraneous query tokens.                                                                                                        |
        | `high`           | One component (excluding `house_number` or `region`) may have been corrected. Additionally, if only `house_number`, `street`, and `postcode` are provided and match, high confidence is returned.      |
        | `medium`         | Two components (excluding `house_number` or `region`) may have changed. Allows for minor misspellings. If `house_number`, `street`, `place`, and `postcode` are matched the `region` may be corrected. |
        | `low`            | `house_number`, `region`, or more than 2 other components have been corrected.                                                                                                                         |

        | Match Code       | Description                                                                                                                                                                                                                                                                                                                                                                                                  |
        | ---------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
        | `matched`        | The component value matches the user's input.                                                                                                                                                                                                                                                                                                                                                                |
        | `unmatched`      | The component value doesn't match the user's input, or the user didn't submit this component type as part of the query.                                                                                                                                                                                                                                                                                      |
        | `not_applicable` | The component is not used in the postal address string for example `locality`.                                                                                                                                                                                                                                                                                                                               |
        | `inferred`       | The component type wasn't submitted as part of the query, but we were able to confidently fill in the value. Only returned for the `country` component.                                                                                                                                                                                                                                                      |
        | `plausible`      | Only relevant for the `address_number` and `secondary_address` components. In the case of `address_number`, this means the address accuracy is interpolated. In the case of `secondary_address`, this means the secondary address was extrapolated, i.e. the primary address is known to have secondary addresses, but the geocoding service did not find a specific matching secondary address in our data. |

        #### Example match_code

        This forward geocoding request with structured input includes a valid street address in Park City Utah, USA.

        `https://api.mapbox.com/search/geocode/v6/forward?address_number=2595&street=lucky john dr&place=park city&region=CO`

        Note that the `region` parameter value is `CO`, and will yield an `unmatched` status in the `match_code` in the resulting feature's properties as the matched address is not in the US state of Colorado.

        ```json
        {
          "name": "2595 Lucky John Drive",
          "place_formatted": "Park City, Utah 84060, United States",
          "match_code": {
            "address_number": "matched",
            "street": "matched",
            "postcode": "unmatched",
            "place": "matched",
            "region": "unmatched",
            "locality": "not_applicable",
            "country": "inferred",
            "confidence": "medium"
          }
        }
        ```
      required:
      - type
      - features
      - attribution
      properties:
        type:
          type: string
          enum:
          - FeatureCollection
          description: '`"FeatureCollection"`, a GeoJSON type from the GeoJSON specification.'
        features:
          type: array
          description: An array of feature objects ordered by relevance (forward) or index hierarchy (reverse).
          items:
            $ref: '#/components/schemas/GeocodingFeature'
        attribution:
          type: string
          description: Attributes the results of the Mapbox Geocoding API to Mapbox.
    BatchGeocodingResponse:
      type: object
      description: The response to a batch geocoding request.
      required:
      - batch
      properties:
        batch:
          type: array
          description: An array of GeoJSON FeatureCollection objects, one per query, in the same order
            as the request. If a query returns no results, its `features` array is empty.
          items:
            $ref: '#/components/schemas/GeocodingResponse'
    GeocodingFeature:
      type: object
      description: A GeoJSON Feature representing a geocoding result.
      required:
      - id
      - type
      - geometry
      - properties
      properties:
        id:
          type: string
          description: Feature id. This property is named "id" to conform to the GeoJSON specification,
            but is the same id referred to as `mapbox_id` elsewhere in the response.
        type:
          type: string
          enum:
          - Feature
        geometry:
          type: object
          required:
          - type
          - coordinates
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              description: '[longitude, latitude]'
              items:
                type: number
              minItems: 2
              maxItems: 2
        properties:
          $ref: '#/components/schemas/GeocodingFeatureProperties'
    GeocodingFeatureProperties:
      type: object
      description: An object containing the resulting feature's details.
      required:
      - mapbox_id
      - feature_type
      - name
      - coordinates
      properties:
        mapbox_id:
          type: string
          description: Feature id. The `mapbox_id` uniquely identifies a place in the Mapbox search database.
            Mapbox IDs are accepted in requests to the Geocoding API as a forward search.
        feature_type:
          type: string
          enum:
          - country
          - region
          - postcode
          - district
          - place
          - locality
          - neighborhood
          - street
          - block
          - address
          - secondary_address
          description: A string describing the type of the feature. Formerly `place_type` in v5.
        name:
          type: string
          description: Formatted string of the feature name (e.g., for an address, formatted string of
            address_number and street).
        name_preferred:
          type: string
          description: The canonical or otherwise more common alias for the feature name.
        place_formatted:
          type: string
          description: Formatted string of result context — the part of the result which comes after `name`
            (place, region, country, postcode).
        full_address:
          type: string
          description: Full formatted string of the feature, combining `name_preferred` and `place_formatted`.
        coordinates:
          type: object
          required:
          - longitude
          - latitude
          properties:
            longitude:
              type: number
            latitude:
              type: number
            accuracy:
              type: string
              enum:
              - rooftop
              - parcel
              - point
              - interpolated
              - approximate
              - intersection
              description: |
                Accuracy metric for a returned `address`-type result.

                The `coordinates.accuracy` property in a Geocoding response object is a point accuracy metric for the returned `address` feature. This list is subject to change.

                | Accuracy       | Description                                                                         |
                | -------------- | ----------------------------------------------------------------------------------- |
                | `rooftop`      | Result intersects a known building/entrance.                                        |
                | `parcel`       | Result is associated with one or more address within a specified polygonal boundary |
                | `point`        | Result is a known address point but does not intersect a known rooftop/parcel.      |
                | `interpolated` | Result position and existence are estimated based on nearby known addresses.        |
                | `approximate`  | Result position is approximated by a 9-digit zipcode centroid.                      |
                | `intersection` | For street type features only. The result is an intersection of 2 streets.          |
            routable_points:
              type: array
              description: |
                An array of routable point objects for an address feature.
                `routable_points` is an array that contains auxiliary geographic points associated with an address, each optimized for a specific access or navigation use case.

                The array contains the following:

                - `default` is the standard, always-included routable point. This is the best navigable vehicle stopping location for accessing the address. This is algorithmically generated and has coverage across all address results.
                - `entrance` is the physical entrance location of the address, when available. This is distinct from the vehicle stop point and is intended for locating the door/entrance to access the building at that address. (In public preview.)
              items:
                type: object
                properties:
                  name:
                    type: string
                  longitude:
                    type: number
                  latitude:
                    type: number
        bbox:
          type: array
          description: The bounding box as `[minLon, minLat, maxLon, maxLat]`. Only provided for country,
            region, postcode, district, place, locality, or neighborhood features.
          items:
            type: number
          minItems: 4
          maxItems: 4
        context:
          $ref: '#/components/schemas/ContextObject'
        match_code:
          $ref: '#/components/schemas/MatchCode'
    ContextObject:
      type: object
      description: |
        A context object representing the hierarchy of encompassing parent features. May include sub-objects for: `address`, `street`, `neighborhood`, `postcode`, `locality`, `place`, `district`, `region`, `country`, `secondary_address`.

        Each sub-object always has a `mapbox_id` and `name`. Address features also include `street_name` and `address_number`.
      properties:
        address:
          type: object
          properties:
            mapbox_id:
              type: string
            address_number:
              type: string
            street_name:
              type: string
            name:
              type: string
        street:
          type: object
          properties:
            mapbox_id:
              type: string
            name:
              type: string
        neighborhood:
          type: object
          properties:
            mapbox_id:
              type: string
            name:
              type: string
            wikidata_id:
              type: string
            alternate:
              type: object
              properties:
                mapbox_id:
                  type: string
                name:
                  type: string
            translations:
              type: object
              additionalProperties:
                type: object
                properties:
                  language:
                    type: string
                  name:
                    type: string
        postcode:
          type: object
          properties:
            mapbox_id:
              type: string
            name:
              type: string
        locality:
          type: object
          properties:
            mapbox_id:
              type: string
            name:
              type: string
            wikidata_id:
              type: string
        place:
          type: object
          properties:
            mapbox_id:
              type: string
            name:
              type: string
            wikidata_id:
              type: string
            alternate:
              type: object
              properties:
                mapbox_id:
                  type: string
                name:
                  type: string
            translations:
              type: object
              additionalProperties:
                type: object
                properties:
                  language:
                    type: string
                  name:
                    type: string
        district:
          type: object
          properties:
            mapbox_id:
              type: string
            name:
              type: string
            wikidata_id:
              type: string
        region:
          type: object
          properties:
            mapbox_id:
              type: string
            name:
              type: string
            wikidata_id:
              type: string
            region_code:
              type: string
              description: ISO 3166-2 region code (e.g., "CA" for California).
            region_code_full:
              type: string
              description: Full ISO 3166-2 region code (e.g., "US-CA").
            translations:
              type: object
              additionalProperties:
                type: object
                properties:
                  language:
                    type: string
                  name:
                    type: string
        country:
          type: object
          properties:
            mapbox_id:
              type: string
            name:
              type: string
            wikidata_id:
              type: string
            country_code:
              type: string
              description: ISO 3166-1 alpha-2 country code (e.g., "US").
            country_code_alpha_3:
              type: string
              description: ISO 3166-1 alpha-3 country code (e.g., "USA").
            translations:
              type: object
              additionalProperties:
                type: object
                properties:
                  language:
                    type: string
                  name:
                    type: string
        secondary_address:
          type: object
          description: Sub-unit, suite, or lot within a single parent address. US only.
          properties:
            mapbox_id:
              type: string
            name:
              type: string
            designator:
              type: string
              description: The secondary address designator (e.g., "UNIT", "APT", "SUITE").
            identifier:
              type: string
              description: The secondary address identifier (e.g., "201", "A", "12B").
            extrapolated:
              type: boolean
              description: If true, the unit number is not known in the data but the parent address has
                secondary addresses.
    MatchCode:
      type: object
      description: |
        Additional metadata indicating how the result components match to the input query. Available only for address-type features.

        **Confidence scores:** `exact` — all components matched (up to 2 inferred); `high` — one component corrected; `medium` — two components corrected; `low` — three+ components corrected.

        **Match code values:** `matched` — component matches input; `unmatched` — doesn't match or not provided; `not_applicable` — component unused in postal addressing; `inferred` — confidently filled in (country only); `plausible` — address_number is interpolated or secondary_address is extrapolated.
      properties:
        address_number:
          type: string
          enum:
          - matched
          - unmatched
          - inferred
          - plausible
        street:
          type: string
          enum:
          - matched
          - unmatched
          - inferred
        postcode:
          type: string
          enum:
          - matched
          - unmatched
          - not_applicable
          - inferred
        place:
          type: string
          enum:
          - matched
          - unmatched
          - not_applicable
          - inferred
        region:
          type: string
          enum:
          - matched
          - unmatched
          - not_applicable
          - inferred
        locality:
          type: string
          enum:
          - matched
          - unmatched
          - not_applicable
          - inferred
        country:
          type: string
          enum:
          - matched
          - unmatched
          - inferred
        secondary_address:
          type: string
          enum:
          - matched
          - unmatched
          - plausible
        confidence:
          type: string
          enum:
          - exact
          - high
          - medium
          - low
    BatchQueryItem:
      type: object
      description: A single query object in a batch geocoding request. Can be a forward query (with `q`
        or structured input fields) or a reverse query (with `longitude` and `latitude`).
      properties:
        q:
          type: string
          maxLength: 256
          description: Search text for forward geocoding (mutually exclusive with structured input fields).
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude for reverse geocoding.
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude for reverse geocoding.
        address_line1:
          type: string
        address_number:
          type: string
        street:
          type: string
        block:
          type: string
        place:
          type: string
        region:
          type: string
        postcode:
          type: string
        locality:
          type: string
        neighborhood:
          type: string
        country:
          type: string
        autocomplete:
          type: boolean
          default: true
        bbox:
          type: string
          description: Bounding box as minLon,minLat,maxLon,maxLat or as a JSON array.
        format:
          type: string
          enum:
          - geojson
          - v5
        language:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 10
        proximity:
          type: string
        types:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        worldview:
          type: string
          enum:
          - ar
          - cn
          - in
          - jp
          - ma
          - rs
          - ru
          - tr
          - us
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
  responses:
    Unauthorized:
      description: |
        Authentication failed.

        | Message | Description |
        | --- | --- |
        | `Not Authorized - No Token` | No token was used in the query. |
        | `Not Authorized - Invalid Token` | Check the access token you used in the query. |
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noToken:
              summary: No token provided
              value:
                message: Not Authorized - No Token
            invalidToken:
              summary: Token is present but invalid
              value:
                message: Not Authorized - Invalid Token
    Forbidden:
      description: |
        There may be an issue with your account. Check your [Account page](https://console.mapbox.com/) for more details. In some cases, using an access token with URL restrictions can also result in a `403` error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                message: Forbidden
    NotFound:
      description: |
        Not found. Check the endpoint you used in the query, or ensure that search text or structured input parameters were provided.

        | Message | Description |
        | --- | --- |
        | `Not Found` | Check the endpoint you used in the query. |
        | `Not Found` | No search text or structured input parameters were provided in the query. |
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              summary: Endpoint not found or no input provided
              value:
                message: Not Found
    UnprocessableEntity:
      description: |
        Validation error. The request was understood but could not be processed due to an invalid parameter value.

        | Message | Description |
        | --- | --- |
        | `BBox is not valid. Must be an array of format [minX, minY, maxX, maxY]` | Check the format for `bbox`, where the first coordinate pair is the southwestern corner and the second is the northeastern corner. |
        | `BBox {minX/maxX} value must be a number between -180 and 180` | Check the format of `minX` and `maxX` for `bbox`. |
        | `BBox {minY/maxY} value must be a number between -90 and 90` | Check the format of `minY` and `maxY` for `bbox`. |
        | `BBox {minX/minY} value cannot be greater than {maxX/maxY} value` | Check the values of the coordinate pairs used in `bbox`. |
        | `Type "{input}" is not a known type. Must be one of: country, region, place, district, postcode, locality, neighborhood, and address` | Check the `types` parameter value you used in the query. |
        | `Stack "{input}" is not a known stack. Must be one of: …` | The `country` parameter must be a valid [ISO 3166 alpha 2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country code. |
        | `Batch queries must include 50 queries or less` | Your batch geocode request cannot contain more than 50 queries. |
        | `Query too long {query length}/256 characters` | Your query cannot contain more than 256 characters. |
        | `Query too long - {query tokens length}/20 tokens` | Your query cannot contain more than 20 word boundary-delimited strings (tokens). |
        | `Proximity must be an array in the form [lon, lat]` | The `proximity` parameter must contain two comma-separated values. |
        | `Proximity lon value must be a number between -180 and 180` | Check the `proximity` parameter's longitude value. |
        | `Proximity lat value must be a number between -90 and 90` | Check the `proximity` parameter's latitude value. |
        | `"{input}" is not a valid language code` | The `language` parameter must be a valid [IETF language tag](https://en.wikipedia.org/wiki/IETF_language_tag) comprised of a mandatory [ISO 639-1 language code](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) and, optionally, one or more IETF subtags for country or script. |
        | `options.language should be a list of no more than 20 languages` | Your query's `language` parameter cannot contain more than 20 language codes. |
        | `options.language should be a list of unique language codes` | The comma-separated values in `language` must be unique. |
        | `limit must be combined with a single type parameter when reverse geocoding` | If you make a reverse geocoding request with the `limit` parameter, you must also use the `types` parameter. |
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidBbox:
              summary: Invalid bbox format
              value:
                message: BBox is not valid. Must be an array of format [minX, minY, maxX, maxY]
            invalidBboxLon:
              summary: bbox longitude value out of range
              value:
                message: BBox minX value must be a number between -180 and 180
            invalidBboxLat:
              summary: bbox latitude value out of range
              value:
                message: BBox minY value must be a number between -90 and 90
            invalidBboxOrder:
              summary: bbox min value greater than max value
              value:
                message: BBox minX value cannot be greater than maxX value
            invalidType:
              summary: Unknown feature type
              value:
                message: 'Type "poi" is not a known type. Must be one of: country, region, place, district,
                  postcode, locality, neighborhood, and address'
            invalidCountry:
              summary: Invalid country code
              value:
                message: 'Stack "XX" is not a known stack. Must be one of: …'
            batchTooLarge:
              summary: Batch request exceeds 50 queries
              value:
                message: Batch queries must include 50 queries or less
            queryTooLongChars:
              summary: Query exceeds 256 characters
              value:
                message: Query too long 300/256 characters
            queryTooLongTokens:
              summary: Query exceeds 20 tokens
              value:
                message: Query too long - 25/20 tokens
            invalidProximityFormat:
              summary: Proximity not in lon,lat format
              value:
                message: Proximity must be an array in the form [lon, lat]
            invalidProximityLon:
              summary: Proximity longitude out of range
              value:
                message: Proximity lon value must be a number between -180 and 180
            invalidProximityLat:
              summary: Proximity latitude out of range
              value:
                message: Proximity lat value must be a number between -90 and 90
            invalidLanguage:
              summary: Invalid language code
              value:
                message: '"xx-ZZ" is not a valid language code'
            tooManyLanguages:
              summary: More than 20 language codes specified
              value:
                message: options.language should be a list of no more than 20 languages
            duplicateLanguages:
              summary: Duplicate language codes in language parameter
              value:
                message: options.language should be a list of unique language codes
            limitWithoutType:
              summary: limit used without types in reverse geocoding
              value:
                message: limit must be combined with a single type parameter when reverse geocoding
    TooManyRequests:
      description: |
        Rate limit exceeded. You have exceeded your set rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimitExceeded:
              value:
                message: Rate limit exceeded
