version: 1
name: copy-style
summary: Copy a style, with its fonts and icons, from one account to another
description: |
  Downloads a style with one credential profile and recreates it with
  another: its custom fonts, the style itself, and its icons. Log in to each
  account first, under its own profile:

    mapbox auth login --profile source
    mapbox auth login --profile target

  The source account needs access to the style download API, which Mapbox
  grants on request. Fonts the target account already has are not uploaded
  again.

  These stay with the source account, and the copy can use them only if the
  target account can read them:

  - tilesets the style's sources use
  - imported styles

  The `warnings` output lists each one the style refers to.

  If a step fails partway, nothing is removed: the error lists what was
  created and the commands that remove it.

inputs:
  style_id:
    type: string
    required: true
    description: ID of the style to copy
  from_profile:
    type: string
    required: true
    description: Profile logged in to the account that owns the style
  to_profile:
    type: string
    required: true
    description: Profile logged in to the account to copy it into
  name:
    type: string
    description: Name for the copy. Defaults to the original's name

steps:
  - id: fetch
    name: Download the style and plan the copy
    script: copy_style.py
    args: [fetch]
    dry_run: true
    stdin:
      style_id: ${{ inputs.style_id }}
      from_profile: ${{ inputs.from_profile }}
      to_profile: ${{ inputs.to_profile }}
      name: ${{ inputs.name }}

  - id: copy
    name: Copy the fonts, the style and its icons
    script: copy_style.py
    args: [apply]
    dry_run: true
    stdin: ${{ steps.fetch.output }}

outputs:
  id: ${{ steps.copy.output.id }}
  name: ${{ steps.copy.output.name }}
  owner: ${{ steps.copy.output.owner }}
  studio: https://studio.mapbox.com/styles/${{ steps.copy.output.owner }}/${{ steps.copy.output.id }}/edit/
  fonts: ${{ steps.copy.output.fonts }}
  icons: ${{ steps.copy.output.icons }}
  warnings: ${{ steps.copy.output.warnings }}
