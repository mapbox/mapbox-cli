openapi: 3.0.3
info:
  title: Geocoding v6 API
  description: |
    The **Mapbox Geocoding API** does two things: _forward geocoding_ and _reverse geocoding_:

    - Forward geocoding converts location text into geographic coordinates, turning `2 Lincoln Memorial Circle SW` into `-77.050,38.889`.
    - Reverse geocoding turns geographic coordinates into place names, turning `-77.050, 38.889` into `2 Lincoln Memorial Circle SW`. These location names can vary in specificity, from individual addresses to states and countries that contain the given coordinates.

    <Note title="Building entrance locations in public preview" theme="beta">
      The `entrances` parameter is in public preview. This parameter allows you to access building entrances in the responses of your geocoding queries - both with permanent and temporary geocoding. To learn more about this parameter, see the [Forward geocoding optional parameters table](https://docs.mapbox.com/api/search/geocoding/#forward-geocoding-with-search-text-input) in the Geocoding API documentation.
    </Note>

    <Note title="Geocoding v5">

    If you are looking for the previous version, see the [Geocoding v5 API](/search/geocoding-v5/) documentation.

    If you are migrating from v5 to v6, note the new changes below:

    - Permanent and temporary geocoding are no longer different endpoints, and are now set via an optional parameter. The default behavior for all endpoints is temporary geocoding.
    - Forward and reverse geocoding now have their own separate endpoints.
    - Batch geocoding now has its own endpoint.
    - The Geocoding v6 API no longer provides POI data (use the [Search Box API](https://docs.mapbox.com/api/search/search-box/) for POI search).
    - Streets can now be returned as a feature type and be filtered for via the `types` parameter.

    </Note>

    <Note title="Geocoding from Snowflake">
      [Snowflake](https://www.snowflake.com/) users can do batch geocoding operations on data stored in their data warehouse. The Mapbox Snowflake Native App is available [in the Snowflake Marketplace](https://app.snowflake.com/marketplace/listing/GZT0ZIFQPEA/mapbox-mapbox?originTab=provider&providerName=Mapbox).
    </Note>

    For more background information on the Mapbox Geocoding API and how it works, see the [How geocoding works guide](https://docs.mapbox.com/help/getting-started/geocoding/#how-geocoding-works).

    You may also use one of several [wrapper libraries](https://docs.mapbox.com/help/getting-started/geocoding/#libraries-and-plugins) to integrate the Mapbox Geocoding API into an application instead of using it directly.

    - For [Mapbox Search JS SDK](https://docs.mapbox.com/mapbox-search-js/guides/), Geocoding components are available on releases `1.0.0-beta.20` and later.

    <RelatedPage
      title="Geocoding API playground"
      url="https://docs.mapbox.com/playground/geocoding/"
      contentType="playground"
    >
      Try forward, reverse, and batch geocoding queries and see the results on a map.
    </RelatedPage>
  version: '6'
  license:
    name: Proprietary
    url: https://www.mapbox.com/legal/tos
  x-mapbox-docs-path: search/geocoding
  x-mapbox-docs-products:
  - Geocoding API
  x-mapbox-docs-description: |
    The Mapbox Geocoding API performs forward geocoding, structured-input geocoding, reverse geocoding, and batch geocoding. It returns standardized addresses, geographic context, and coordinates.
servers:
- url: https://api.mapbox.com
  description: Mapbox API
security:
- AccessTokenAuth: []
tags:
- name: Forward Geocoding
  description: Convert location text or structured address components into geographic coordinates
- name: Reverse Geocoding
  description: Convert geographic coordinates into place names and addresses
- name: Batch Geocoding
  description: Submit up to 50 forward or reverse geocoding queries in a single POST request
paths:
  /search/geocode/v6/forward:
    get:
      summary: Forward geocoding
      description: |
        The **forward geocoding** query type allows you to look up a location using a string of search text and returns its standardized address, geographic context, and coordinates.

        ## Forward geocoding with search text input

        Use the `q` parameter to search with a string of text. The search text should be expressed as a URL-encoded UTF-8 string, and must not contain the semicolon character (either raw or URL-encoded). Your search text, once decoded, must consist of at most 20 words and numbers separated by spacing and punctuation, and at most 256 characters.

        The accuracy of coordinates returned by a forward geocoding request can be affected by how the addresses in the query are formatted. Learn more about address formatting best practices in the [Address geocoding format guide](https://docs.mapbox.com/help/troubleshooting/address-geocoding-format-guide/).


        ## Forward geocoding with structured input

        **Structured Input** is a type of forward geocoding search that allows you to define the feature type of each element of the search query by type. This can increase the accuracy of results for well-formed datasets. To use Structured Input, the `q` parameter is dropped in favor of separate parameters for each feature type: `address_line1`, `address_number`, `street`, `block`, `place`, `region`, `postcode`, `locality`, `neighborhood`, `country`.

        For best results, each element of the query must be assigned a feature type, and set `autocomplete` to `false`.

        For the `country` structured input parameter specifically: when the ISO code is passed it acts as a hard filter on search results; when a full country name is passed, it influences the search results but is not a hard filter.

        ### Recommended testing method for entrance data

        Run an offline comparison of entrance data to test it quickly at scale:

        1. Run existing geocoder locations and Mapbox entrance points against the same set of addresses.
        2. Compare each result to a known reference point (for example, a past delivery location or other ground-truth coordinate) and measure which point is closer to the reference.
        3. The resulting distance-to-reference metric quantifies how often Mapbox entrance data places drivers closer to the correct entrance. The metric can be directly correlated to the efficiency gains, reduced dwell time, and lower support volume that would result from deploying Mapbox entrance locations in a production environment.

        ## Intersection search support

        Intersection search allows users to search for a point where two streets intersect, without a precise address. Make an intersection search request by inserting an intersection connector between 2 streets. Intersection search is not available in all countries.

        | Connector    | Applicable countries                                 |
        | ------------ | ---------------------------------------------------- |
        | `&`          | All countries where intersection search is supported |
        | `and` or `x` | IN, JM, US                                           |
        | `e`          | AR, BO, BR, CO, CR, DO, EC, GT, NI, PA, PE, SV, UY  |

        ```bash
        # Intersection search using 'and'
        $ curl "https://api.mapbox.com/search/geocode/v6/forward?q=Market%20Street%20and%20Fremont%20Street&proximity=-122.39738575285674,37.7925147111369453&access_token=YOUR_MAPBOX_ACCESS_TOKEN"

        # Intersection search using '&'
        $ curl "https://api.mapbox.com/search/geocode/v6/forward?q=Market%20Street%20%26%20Fremont%20Street&proximity=-122.39738575285674,37.7925147111369453&access_token=YOUR_MAPBOX_ACCESS_TOKEN"
        ```
      operationId: forwardGeocode
      tags:
      - Forward Geocoding
      parameters:
      - name: q
        in: query
        required: false
        description: "The feature you're trying to look up. This could be an address, a city name, etc.\
          \ The search text should be expressed as a URL-encoded UTF-8 string, and must not contain the\
          \ semicolon character (either raw or URL-encoded). Your search text, once decoded, must consist\
          \ of at most 20 words and numbers separated by spacing and punctuation, and at most 256 characters.\n\
          \n>Please Note: If no types parameter is set, or the `secondary_address` type is included in\
          \ the types filter, searching for secondary addresses will be enabled. Secondary address queries\
          \ are detected after a \"designator\" token (e.g. \"Apt\", \"Suite\", \"Unit\", \"#\") is followed\
          \ by an identifier token (e.g. \"12B\", \"A\", \"103\"). If a parent address is known to have\
          \ secondary addresses, we will first return known units within our data matching the provided\
          \ identifier. If the identifier is not known in our data, the unit will be \"extrapolated\"\
          , i.e. returned as typed with the same coordinate as the parent address.        \n\nEither `q`\
          \ or at least one structured input parameter (`address_line1`, `address_number`, `street`, `block`,\
          \ `place`, `region`, `postcode`, `locality`, `neighborhood`, `country`) must be provided.\n"
        schema:
          type: string
          maxLength: 256
      - name: address_line1
        in: query
        required: false
        description: 'Structured input: A string including address_number and street. These values can
          also be provided as separate parameters `address_number` and `street`.'
        schema:
          type: string
      - name: address_number
        in: query
        required: false
        description: 'Structured input: The number associated with the house.'
        schema:
          type: string
      - name: street
        in: query
        required: false
        description: 'Structured input: The name of the street in the address.'
        schema:
          type: string
      - name: block
        in: query
        required: false
        description: 'Structured input: In some countries like Japan, the block is a component in the
          address.'
        schema:
          type: string
      - name: place
        in: query
        required: false
        description: 'Structured input: Typically these are cities, villages, municipalities, etc. They''re
          usually features used in postal addressing, and are suitable for display in ambient end-user
          applications where current-location context is needed (for example, in weather displays).'
        schema:
          type: string
      - name: region
        in: query
        required: false
        description: 'Structured input: Top-level sub-national administrative features, such as states
          in the United States or provinces in Canada or China.'
        schema:
          type: string
      - name: postcode
        in: query
        required: false
        description: 'Structured input: Postal codes used in country-specific national addressing systems.'
        schema:
          type: string
      - name: locality
        in: query
        required: false
        description: 'Structured input: Official sub-city features present in countries where such an
          additional administrative layer is used in postal addressing. Examples include city districts
          in Brazil and Chile and arrondissements in France.'
        schema:
          type: string
      - name: neighborhood
        in: query
        required: false
        description: 'Structured input: Colloquial sub-city features often referred to in local parlance.
          Not available for reverse geocoding requests.'
        schema:
          type: string
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/permanent'
      - name: autocomplete
        in: query
        required: false
        description: |
          Specify whether to return autocomplete results (`true`, default) or not (`false`). When autocomplete is enabled, results will be included that start with the requested string, rather than responses that match it exactly. For example, a query for `India` might return both `India` and `Indiana` with autocomplete enabled, but only `India` if it's disabled.

          When autocomplete is enabled, each user keystroke counts as one request to the Geocoding API. For example, a search for "Cali" would be reflected as four separate Geocoding API requests. To reduce the total requests sent, you can configure your application to only call the Geocoding API after a specific number of characters are typed.
        schema:
          type: boolean
          default: true
      - $ref: '#/components/parameters/bbox'
      - name: country
        in: query
        required: false
        description: |
          Limit results to one or more countries. Permitted values are [ISO 3166 alpha 2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) country codes separated by commas.

          When used as a structured input parameter (instead of a filter), you may also pass the full country name. When the ISO code is passed it acts as a hard filter; when a full name is passed it influences results but is not a hard filter.
          ### Japan Geocoding

            The Geocoding API includes a robust Japan address and place search. To access the new, high-accuracy and high-coverage Japan search, you must set both the `language` and `country` parameters:

            - `language=ja`
            - `country=jp`

            Japan geocoding responses use the same geographic feature types as other countries to define a feature's context components (with the addition of a `block` component, where applicable). These feature types represent the following equivalents of a Japanese address structure:

            | Geographic feature type | Japan address equivalent |
            | ----------------------- | ------------------------ |
            | `block`                 | block                    |
            | `neighborhood`          | chome                    |
            | `locality`              | oaza                     |
            | `place`                 | city                     |
            | `region`                | prefecture               |

            Japan geocoding responses also contain a unique `feature.properties.reading` object for Japanese reading equivalents by script type:

            ```json
            {
              "ja-Kana": "ヤマグチケンシモノセキシシンアカダニシマチ",
              "ja-Latn": "yamaguchiken shimonosekishi shinakadanishimachi"
            }
            ```
        schema:
          type: string
          example: us,ca
      - name: format
        in: query
        required: false
        description: Specify the desired response format of results (`geojson`, default) or for backwards
          compatibility (`v5`).
        schema:
          type: string
          enum:
          - geojson
          - v5
          default: geojson
      - $ref: '#/components/parameters/language'
      - name: limit
        in: query
        required: false
        description: Specify the maximum number of results to return. The default is `5` and the maximum
          supported is `10`.
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      - $ref: '#/components/parameters/proximity'
      - $ref: '#/components/parameters/types_v6'
      - $ref: '#/components/parameters/worldview'
      - $ref: '#/components/parameters/entrances'
      responses:
        '200':
          description: A GeoJSON FeatureCollection of forward geocoding results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodingResponse'
              examples:
                forwardGeocodeBasic:
                  $ref: '#/components/examples/ForwardGeocodeResult'
                forwardGeocodeProximity:
                  $ref: '#/components/examples/ForwardGeocodeResult'
                forwardGeocodeTypes:
                  $ref: '#/components/examples/ForwardGeocodeResult'
                forwardGeocodeLimit:
                  $ref: '#/components/examples/ForwardGeocodeResult'
                forwardGeocodeWorldview:
                  $ref: '#/components/examples/ForwardGeocodeResult'
                forwardGeocodeStructured:
                  $ref: '#/components/examples/ForwardGeocodeResult'
                forwardGeocodeIntersection:
                  $ref: '#/components/examples/ForwardGeocodeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-mapbox-docs-examples:
      - example-id: forwardGeocodeBasic
        title: Find Los Angeles
        request:
          q: Los%20Angeles
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      - example-id: forwardGeocodeProximity
        title: Find Chester, New Jersey using proximity
        request:
          q: chester
          proximity: -74.70850,40.78375
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      - example-id: forwardGeocodeTypes
        title: Search only for countries named Georgia
        request:
          q: georgia
          types: country
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      - example-id: forwardGeocodeLimit
        title: Limit results to two
        request:
          q: Washington
          limit: 2
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      - example-id: forwardGeocodeWorldview
        title: Search with a worldview
        request:
          q: Kaaleng
          worldview: cn
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      - example-id: forwardGeocodeStructured
        title: Forward geocoding with structured input
        request:
          country: us
          address_number: '1600'
          street: pennsylvania%20ave%20nw
          postcode: '20500'
          place: Washington%20dc
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      - example-id: forwardGeocodeIntersection
        title: Intersection search
        request:
          q: Market%20Street%20and%20Fremont%20Street
          proximity: -122.39738575285674,37.7925147111369453
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      x-mapbox-cli-command:
      - geocoder
      - forward
  /search/geocode/v6/reverse:
    get:
      summary: Reverse geocoding
      description: |
        The **reverse geocoding** query type allows you to look up a pair of coordinates and returns the geographic features there, including a standardized address or place and full geographic context.
      operationId: reverseGeocode
      tags:
      - Reverse Geocoding
      parameters:
      - name: longitude
        in: query
        required: true
        description: The `longitude` decimal value from the geographic coordinate for the location being
          queried.
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: latitude
        in: query
        required: true
        description: The `latitude` decimal value from the geographic coordinate for the location being
          queried.
        schema:
          type: number
          minimum: -90
          maximum: 90
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/permanent'
      - name: country
        in: query
        required: false
        description: Limit results to one or more countries. Permitted values are [ISO 3166 alpha 2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)
          country codes separated by commas.
        schema:
          type: string
          example: us,ca
      - $ref: '#/components/parameters/language'
      - name: limit
        in: query
        required: false
        description: |
          Specify the maximum number of results to return. The default is `1` and the maximum supported is `5`.

          The default behavior in reverse geocoding is to return at most one feature at each of the multiple levels of the administrative hierarchy (for example, one address, one region, one country). Increasing the limit allows returning multiple features of the same type, but only for one type (for example, multiple `address` results). So, setting `limit` to a higher-than-default value requires specifying exactly one `types` parameter.
        schema:
          type: integer
          minimum: 1
          maximum: 5
          default: 1
      - $ref: '#/components/parameters/types_v6'
      - $ref: '#/components/parameters/worldview'
      responses:
        '200':
          description: A GeoJSON FeatureCollection of reverse geocoding results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodingResponse'
              examples:
                reverseGeocodeBasic:
                  $ref: '#/components/examples/ReverseGeocodeResult'
                reverseGeocodeTypes:
                  $ref: '#/components/examples/ReverseGeocodeResult'
                reverseGeocodeWorldview:
                  $ref: '#/components/examples/ReverseGeocodeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-mapbox-docs-examples:
      - example-id: reverseGeocodeBasic
        title: Retrieve places near a specific location
        request:
          longitude: -73.989
          latitude: 40.733
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      - example-id: reverseGeocodeTypes
        title: Filter results to only include addresses
        request:
          longitude: -73.989
          latitude: 40.733
          types: address
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      - example-id: reverseGeocodeWorldview
        title: Query within the Ilemi Triangle for the US worldview
        request:
          longitude: 35.4628
          latitude: 4.8975
          worldview: us
          access_token: YOUR_MAPBOX_ACCESS_TOKEN
      x-mapbox-cli-command:
      - geocoder
      - reverse
  /search/geocode/v6/batch:
    post:
      summary: Batch geocoding
      description: |
        The batch geocoding query type allows you to request up to 50 forward or reverse geocoding queries in a single request.

        Batch geocoding requests are formatted as a JSON array passed as the `BODY` of the request, with multiple search queries one after another. Fields which were defined as query parameters in the URL string will become fields in the JSON object. Fields specifying multiple values (for example `types`, `country`, `bbox`, `proximity`) can be passed either as comma-separated strings or as JSON-formatted arrays (for example a types filter value could be represented as `"address,street,place"` or `["address", "street", "place"]`).

        In a single batch geocoding request, you can bundle queries of different types, including forward queries, forward Structured Input queries, and reverse queries. Each query can also have parameters defined individually — for example one query could have IP proximity set to on while the rest have it off.

        <Note title="Billing for batch geocoding requests">
          Each individual search in a batch geocoding request counts as one request.
        </Note>

        ### Example request: Batch geocoding

        ```bash
        curl --location --request POST "https://api.mapbox.com/search/geocode/v6/batch?access_token=YOUR_MAPBOX_ACCESS_TOKEN" \
        --header 'Content-Type: application/json' \
        --data-raw '[
            {
                "types": ["address"],
                "q": "1600 Pennsylvania Avenue NW, Washington, DC 20500, United States",
                "bbox": [-80, 35, -70, 40],
                "limit": 1
            },
            {
                "country": "us",
                "address_number": "1600",
                "street": "Pennsylvania Avenue NW",
                "postcode": "20500",
                "place": "Washington, DC"
            },
            {
                "types": ["address"],
                "longitude": -73.986136,
                "latitude": 40.748895
            }
        ]'
        ```

        ### Response: Batch geocoding

        The response from a batch geocoding query is an object with a `batch` property. The batch property is an array of Geocoding response objects. The order of queries in the request determines the order of corresponding objects in the batch array. If there are no results returned for a particular query within the batch, the `features` array for that query is empty (`"features": []`).

        ```json
        {
          "batch": [
            {
              "type": "FeatureCollection",
              "features": [
                {
                  "type": "Feature",
                  "id": "dXJuOm1ieGFkcjo2YzdhYjM4Yi05YzM4LTQ3ZDItODFkMS1jYzZlYjg5YzliMWM",
                  "geometry": { "type": "Point", "coordinates": [-77.03655, 38.89768] },
                  "properties": {
                    "mapbox_id": "dXJuOm1ieGFkcjo2YzdhYjM4Yi05YzM4LTQ3ZDItODFkMS1jYzZlYjg5YzliMWM",
                    "feature_type": "address",
                    "name": "1600 Pennsylvania Avenue Northwest",
                    "coordinates": { "longitude": -77.03655, "latitude": 38.89768, "accuracy": "rooftop" },
                    "place_formatted": "Washington, District of Columbia 20500, United States",
                    "match_code": {
                      "address_number": "matched", "street": "matched", "postcode": "matched",
                      "place": "matched", "region": "matched", "locality": "not_applicable",
                      "country": "inferred", "confidence": "exact"
                    }
                  }
                }
              ],
              "attribution": "NOTICE: © 2023 Mapbox and its suppliers. All rights reserved. Use of this data is subject to the Mapbox Terms of Service (https://www.mapbox.com/about/maps/). This response and the information it contains may not be retained."
            },
            {
              "type": "FeatureCollection",
              "features": [],
              "attribution": "NOTICE: © 2023 Mapbox and its suppliers. All rights reserved. Use of this data is subject to the Mapbox Terms of Service (https://www.mapbox.com/about/maps/). This response and the information it contains may not be retained."
            },
            {
              "type": "FeatureCollection",
              "features": [
                {
                  "type": "Feature",
                  "id": "dXJuOm1ieGFkcjplMzVmMzZiOC1kYjRmLTQyOWItOWE4ZC0yZGQ3ZmQ1OTUzMTY",
                  "geometry": { "type": "Point", "coordinates": [-73.9861365, 40.7488949] },
                  "properties": {
                    "mapbox_id": "dXJuOm1ieGFkcjplMzVmMzZiOC1kYjRmLTQyOWItOWE4ZC0yZGQ3ZmQ1OTUzMTY",
                    "feature_type": "address",
                    "name": "20 West 34th Street",
                    "coordinates": { "longitude": -73.9861365, "latitude": 40.7488949, "accuracy": "rooftop" },
                    "place_formatted": "New York, New York 10118, United States"
                  }
                }
              ],
              "attribution": "NOTICE: © 2023 Mapbox and its suppliers. All rights reserved. Use of this data is subject to the Mapbox Terms of Service (https://www.mapbox.com/about/maps/). This response and the information it contains may not be retained."
            }
          ]
        }
        ```
      operationId: batchGeocode
      tags:
      - Batch Geocoding
      security:
      - AccessTokenAuth: []
      parameters:
      - $ref: '#/components/parameters/access_token'
      - $ref: '#/components/parameters/permanent'
      requestBody:
        required: true
        description: A JSON array of up to 50 geocoding query objects. Each object can be a forward geocoding
          query (with `q` or structured input fields), or a reverse geocoding query (with `longitude`
          and `latitude`).
        content:
          application/json:
            schema:
              type: array
              maxItems: 50
              items:
                $ref: '#/components/schemas/BatchQueryItem'
            examples:
              batchGeocodeMixed:
                summary: Mixed forward, structured input, and reverse batch request
                value:
                - types:
                  - address
                  q: 1600 Pennsylvania Avenue NW, Washington, DC 20500, United States
                  bbox: -80,35,-70,40
                  limit: 1
                - country: us
                  address_number: '1600'
                  street: Pennsylvania Avenue NW
                  postcode: '20500'
                  place: Washington, DC
                - types:
                  - address
                  longitude: -73.986136
                  latitude: 40.748895
      responses:
        '200':
          description: An object with a `batch` array containing one GeoJSON FeatureCollection per query,
            in the same order as the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGeocodingResponse'
              examples:
                batchGeocodeMixed:
                  summary: Batch geocoding response with mixed queries
                  value:
                    batch:
                    - type: FeatureCollection
                      features:
                      - type: Feature
                        id: dXJuOm1ieGFkcjo2YzdhYjM4Yi05YzM4LTQ3ZDItODFkMS1jYzZlYjg5YzliMWM
                        geometry:
                          type: Point
                          coordinates:
                          - -77.03655
                          - 38.89768
                        properties:
